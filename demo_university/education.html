<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Demo University — Education</title>
<link rel="stylesheet" href="style.css"></head>
<body data-step="education"><header>Demo University<small>Applicant Portal (demo)</small></header><main>
<h1>Education</h1>
<label for="institution">Institution *</label><input type="text" id="institution" name="institution" required>
<label for="degree">Degree *</label><input type="text" id="degree" name="degree" required>
<label for="grad-year">Graduation year *</label><input type="number" id="grad-year" name="graduation_year" required>
<label for="gpa">Undergraduate GPA *</label><input type="number" step="0.01" id="gpa" name="gpa" required>
<label for="sat">SAT score *</label><input type="number" id="sat" name="sat_score" required>
<div id="error" class="error"></div><button id="save-continue" type="button">Save &amp; Continue</button>
</main><script src="app.js"></script></body></html>
