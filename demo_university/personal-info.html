<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Demo University — Personal information</title>
<link rel="stylesheet" href="style.css"></head>
<body data-step="personal-info"><header>Demo University<small>Applicant Portal (demo)</small></header><main>
<h1>Personal information</h1>
<label for="full-name">Full name *</label><input type="text" id="full-name" name="full_name" required>
<label for="email">Email address *</label><input type="email" id="email" name="email" required>
<label for="dob">Date of birth *</label><input type="date" id="dob" name="dob" required>
<label for="address">Mailing address *</label><input type="text" id="address" name="address" required>
<div id="error" class="error"></div><button id="save-continue" type="button">Save &amp; Continue</button>
</main><script src="app.js"></script></body></html>
