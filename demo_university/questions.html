<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Demo University — Application questions</title>
<link rel="stylesheet" href="style.css"></head>
<body data-step="questions"><header>Demo University<small>Applicant Portal (demo)</small></header><main>
<h1>Application questions</h1>
<label for="statement">Personal statement *</label><textarea id="statement" name="personal_statement" required></textarea>

</main><script src="app.js"></script></body></html>
